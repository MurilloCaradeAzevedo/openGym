name: Deploy

# After main's images are published (docker-publish.yml), and only when the tests of that same
# commit passed (test.yml), the production server checks out that commit and runs the images
# tagged sha-<commit>. Skipped until the repository has the DEPLOY_HOST, DEPLOY_USER and
# DEPLOY_SSH_KEY secrets (DEPLOY_KNOWN_HOSTS is then required too, and the DEPLOY_DOMAIN variable
# enables the health check), and on any repository other than the fork it was written for.
# A manual run deploys the head of the chosen branch, whose images must already be published.
on:
  workflow_run:
    workflows: ["Publish Docker images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'MurilloCaradeAzevedo/openGym' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HAS_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Secrets present
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::No DEPLOY_* secrets yet, nothing deployed." && exit 0

      - name: Tests passed for this commit
        if: env.HAS_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The tests and the image build start from the same push; wait for the tests to finish.
        run: |
          for i in $(seq 1 40); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "none none")
            echo "tests for $SHA: $run"
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Tests did not pass for $SHA; not deploying."; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Tests for $SHA did not finish in 20 minutes; not deploying."; exit 1

      - name: Deploy this commit on the server
        if: env.HAS_SECRETS == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The server's public host key line(s), taken once by the owner and checked against the
          # server's own fingerprint (deploy/README.md). Never learned during the run.
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # /usr/local/sbin/opengym-deploy (installed root-owned by setup-server.sh) checks out exactly
        # $SHA and starts the images tagged sha-$SHA, never :edge.
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected commit id"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::The DEPLOY_KNOWN_HOSTS secret is missing; not deploying."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$USER@$HOST" "sudo /usr/local/sbin/opengym-deploy $SHA"

      - name: Health check
        if: env.HAS_SECRETS == 'true' && vars.DEPLOY_DOMAIN != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://${{ vars.DEPLOY_DOMAIN }}/api/health" && exit 0
            sleep 6
          done
          echo "::error::https://${{ vars.DEPLOY_DOMAIN }}/api/health did not answer"; exit 1
