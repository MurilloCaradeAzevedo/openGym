name: Deploy

# After main's images are published (docker-publish.yml), and only when the tests of that same
# commit passed (test.yml), the production server pulls them and restarts. Skipped until the
# repository has the DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY secrets (and the DEPLOY_DOMAIN
# variable for the health check), and on any repository other than the fork it was written for.
on:
  workflow_run:
    workflows: ["Publish Docker images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'MurilloCaradeAzevedo/openGym' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HAS_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Secrets present
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::No DEPLOY_* secrets yet, nothing deployed." && exit 0

      - name: Tests passed for this commit
        if: env.HAS_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The tests and the image build start from the same push; wait for the tests to finish.
        run: |
          for i in $(seq 1 40); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "none none")
            echo "tests for $SHA: $run"
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Tests did not pass for $SHA; not deploying."; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Tests for $SHA did not finish in 20 minutes; not deploying."; exit 1

      - name: Pull and restart on the server
        if: env.HAS_SECRETS == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # The key is a forced command on the server (deploy/redeploy.sh via setup-server.sh): all
        # it can do is start the images CI built from the commit sent here.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the host key on first use."
            ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "$USER@$HOST" "$SHA"

      - name: Health check
        if: env.HAS_SECRETS == 'true' && vars.DEPLOY_DOMAIN != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://${{ vars.DEPLOY_DOMAIN }}/api/health" && exit 0
            sleep 6
          done
          echo "::error::https://${{ vars.DEPLOY_DOMAIN }}/api/health did not answer"; exit 1
