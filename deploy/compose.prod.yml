# Production on one server: the images CI publishes for this fork, Caddy for HTTPS, bounded logs.
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml pull
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d
# IMAGE_OWNER and IMAGE_TAG come from .env (setup-server.sh writes them; each deploy pins
# IMAGE_TAG=sha-<commit>).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  api:
    image: ghcr.io/${IMAGE_OWNER}/opengym-api:${IMAGE_TAG:-edge}
    pull_policy: always
    # A public server is closed by default, even with an older .env that never set these.
    # setup-server.sh opens sign-up once (INVITE_ONLY=0 for that run only) so the owner can join.
    environment:
      - INVITE_ONLY=${INVITE_ONLY:-1}
      - ALLOW_GUEST=${ALLOW_GUEST:-0}
    logging: *logging
  web:
    image: ghcr.io/${IMAGE_OWNER}/opengym-web:${IMAGE_TAG:-edge}
    pull_policy: always
    # Only Caddy is reachable from outside; web is on the compose network.
    ports: !reset []
    # Caddy puts the visitor's address in X-Forwarded-For (it replaces whatever the visitor sent), and
    # nginx would otherwise see only Caddy's. Without this every visitor shares one rate-limit bucket.
    # Safe here because Caddy is the only way in; never set it on an install that exposes web directly.
    environment:
      - CF_CONNECTING_IP=$$http_x_forwarded_for
    logging: *logging
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    logging: *logging
